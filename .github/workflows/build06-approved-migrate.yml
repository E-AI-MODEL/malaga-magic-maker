name: BUILD 06 authorized branch migration

on:
  push:
    branches:
      - vakansie/build-06-auth-invites
    paths:
      - .build06-trigger2

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BUILD 06
        uses: actions/checkout@v4
        with:
          ref: vakansie/build-06-auth-invites
          fetch-depth: 0
          path: build06

      - name: Apply staged frontend migration
        working-directory: build06
        run: python3 .github/scripts/build06_frontend.py

      - name: Remove one-time BUILD 06 files
        working-directory: build06
        run: |
          rm -rf .build06
          rm -f .build06-trigger
          rm -f .build06-trigger2
          rm -f .github/workflows/build06-frontend-migrate.yml
          rm -f .github/workflows/build06-pr-migrate.yml
          rm -f .github/workflows/build06-marker-migrate.yml
          rm -f .github/workflows/build06-approved-migrate.yml
          rm -f .github/scripts/build06_frontend.py
          rmdir .github/scripts 2>/dev/null || true

      - name: Commit BUILD 06 migration
        working-directory: build06
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply BUILD 06 production auth frontend"
          git push origin HEAD:vakansie/build-06-auth-invites

      - name: Checkout main for cleanup
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: main-cleanup

      - name: Remove temporary authorization workflow from main
        working-directory: main-cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build06-approved-migrate.yml
          git commit -m "Remove temporary BUILD 06 migration workflow"
          git push origin HEAD:main

name: BUILD 06 PR frontend migration

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'vakansie/build-06-auth-invites'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: vakansie/build-06-auth-invites
          fetch-depth: 0

      - name: Apply staged frontend migration
        run: python3 .github/scripts/build06_frontend.py

      - name: Remove one-time migration files
        run: |
          rm -rf .build06
          rm -f .github/workflows/build06-frontend-migrate.yml
          rm -f .github/workflows/build06-pr-migrate.yml
          rm -f .github/scripts/build06_frontend.py
          rmdir .github/scripts 2>/dev/null || true

      - name: Commit migrated frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply BUILD 06 production auth frontend"
          git push origin HEAD:vakansie/build-06-auth-invites

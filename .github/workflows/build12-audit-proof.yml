name: BUILD 12 audit proof

on:
  push:
    branches:
      - vakansie/build-12-production-hardening

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vakansie/build-12-production-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps
      - name: Prove zero critical findings
        run: |
          npm audit --json > audit-proof.json || true
          node scripts/audit-summary.mjs audit-proof.json
      - name: Write proof marker
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-proof.json','utf8'));
          const v = report.metadata?.vulnerabilities || {};
          const text = `# BUILD 12 dependency audit proof\n\nGenerated by CI from the committed lockfile.\n\n- critical: ${v.critical || 0}\n- high: ${v.high || 0}\n- moderate: ${v.moderate || 0}\n- low: ${v.low || 0}\n\nA critical finding would have failed before this file was written.\n`;
          fs.writeFileSync('docs/builds/BUILD_12_DEPENDENCY_AUDIT_PASS.md', text);
          NODE
          if git diff --quiet -- docs/builds/BUILD_12_DEPENDENCY_AUDIT_PASS.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/builds/BUILD_12_DEPENDENCY_AUDIT_PASS.md
          git commit -m 'Record zero-critical dependency audit proof'
          git push origin HEAD:vakansie/build-12-production-hardening

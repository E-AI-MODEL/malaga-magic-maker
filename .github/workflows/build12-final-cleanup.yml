name: BUILD 12 final workflow cleanup

on:
  push:
    branches:
      - vakansie/build-12-production-hardening

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vakansie/build-12-production-hardening
          fetch-depth: 0
      - name: Remove temporary BUILD 12 workflow helpers
        run: |
          if [ ! -f docs/builds/BUILD_12_QUALITY_PASS.md ]; then
            echo 'Quality proof not present; refusing cleanup.'
            exit 1
          fi
          git rm -f --ignore-unmatch \
            .github/workflows/build12-safe-audit-remediation.yml \
            .github/workflows/build12-audit-proof.yml \
            .github/workflows/build12-cleanup.yml \
            .github/workflows/build12-quality-proof.yml \
            .github/workflows/build12-final-cleanup.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary BUILD 12 workflow helpers'
          git push origin HEAD:vakansie/build-12-production-hardening

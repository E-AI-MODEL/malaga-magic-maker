name: BUILD 12 runtime dependency proof

on:
  push:
    branches:
      - vakansie/build-12-production-hardening

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vakansie/build-12-production-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps
      - name: Prove runtime dependency safety
        run: |
          npm audit --omit=dev --json > runtime-proof.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('runtime-proof.json','utf8'));
          const v = report.metadata?.vulnerabilities || {};
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            console.error(`runtime critical=${v.critical || 0} high=${v.high || 0}`);
            process.exit(1);
          }
          fs.writeFileSync('docs/builds/BUILD_12_RUNTIME_AUDIT_PASS.md', `# BUILD 12 runtime dependency audit proof\n\n- critical: ${v.critical || 0}\n- high: ${v.high || 0}\n- moderate: ${v.moderate || 0}\n- low: ${v.low || 0}\n\nThis proof uses npm audit --omit=dev on the committed lockfile.\n`);
          NODE
      - name: Commit proof and remove temporary workflow
        run: |
          git rm .github/workflows/build12-runtime-proof.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/builds/BUILD_12_RUNTIME_AUDIT_PASS.md
          git commit -m 'Record runtime dependency audit proof'
          git push origin HEAD:vakansie/build-12-production-hardening

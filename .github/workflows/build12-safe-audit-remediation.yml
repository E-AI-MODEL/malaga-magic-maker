name: BUILD 12 safe audit remediation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    if: github.head_ref == 'vakansie/build-12-production-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: vakansie/build-12-production-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install current dependency set
        run: npm install --legacy-peer-deps

      - name: Apply non-breaking lockfile audit fixes only
        run: |
          cp package.json /tmp/package.json.before
          npm audit fix --package-lock-only --legacy-peer-deps || true
          cmp --silent package.json /tmp/package.json.before || {
            echo 'package.json changed unexpectedly; refusing remediation'
            git checkout -- package.json
            exit 1
          }

      - name: Verify critical is gone after safe lockfile fix
        run: |
          npm install --legacy-peer-deps
          npm audit --json > audit-after.json || true
          node scripts/audit-summary.mjs audit-after.json

      - name: Commit lockfile-only remediation
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No safe lockfile remediation available.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Resolve critical dependency within existing ranges'
          git push origin HEAD:vakansie/build-12-production-hardening

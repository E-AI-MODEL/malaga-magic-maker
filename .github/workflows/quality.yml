name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main
      - "vakansie/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Dependency audit
        run: |
          npm audit --json > audit.json || true
          node scripts/audit-summary.mjs audit.json

      - name: Typecheck
        run: npm run typecheck

      - name: Check Edge Functions
        run: |
          deno check supabase/functions/accommodation-search/index.ts
          deno check supabase/functions/booking-parse/index.ts
          deno check supabase/functions/create-checkout/index.ts
          deno check supabase/functions/document-extract/index.ts
          deno check supabase/functions/firecrawl-scrape/index.ts
          deno check supabase/functions/ops-admin-users/index.ts
          deno check supabase/functions/payments-account/index.ts
          deno check supabase/functions/payments-webhook/index.ts
          deno check supabase/functions/trip-ai-chat/index.ts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
